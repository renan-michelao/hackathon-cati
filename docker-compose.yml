# Sobe o sistema inteiro com: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leilao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-leilao}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 e não localhost: no Alpine, localhost resolve para ::1 (IPv6) primeiro
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  worker:
    build: ./api
    restart: unless-stopped
    env_file: .env
    command: ["node", "dist/worker.js"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

  # Só para rodar na máquina de desenvolvimento: armazenamento S3 local.
  # Na VM NÃO use este perfil (RF07: fotos não podem ficar no disco da VM).
  # Ative com: docker compose --profile local up -d --build
  s3-local:
    image: chrislusf/seaweedfs:latest
    profiles: ["local"]
    restart: unless-stopped
    # volumes de 100 MB: o padrão (30 GB por volume) falha em discos com pouco espaço livre
    command: ["server", "-s3", "-ip.bind=0.0.0.0", "-dir=/data", "-master.volumeSizeLimitMB=100", "-volume.max=20"]
    volumes:
      - s3data:/data

volumes:
  pgdata:
  s3data:
