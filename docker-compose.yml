# Sobe o sistema inteiro com: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leilao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-leilao}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
      network: host
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 e não localhost: no Alpine, localhost resolve para ::1 (IPv6) primeiro
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      # D29: fotos no disco da VM, num volume que sobrevive a rebuilds e reinícios
      - fotos:/data/fotos

  worker:
    build:
      context: ./api
      network: host
    restart: unless-stopped
    env_file: .env
    command: ["node", "dist/worker.js"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      network: host
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  fotos:
